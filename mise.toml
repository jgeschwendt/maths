[tools]
bun = "1.4.4"
# hk runs the pre-push gate (hk.pkl); `hk install --mise` wires it
hk = { version = "2.12.0", workflow = "release.yml" }
# the oxlint and oxfmt launchers run under node
node = "24"

[tasks.check]
description = "the gate hk's pre-push and CI run: format, lint, types, the suite at 100 % coverage (docs/index.html current with its figures included), the stele graph"
run = [
  "bunx oxfmt --check",
  "bunx oxlint",
  "bunx tsc -p .",
  "bun test --coverage",
  "stele check",
  "stele emit --check",
]

[tasks.docs]
description = "render every computed figure into docs/index.html between its markers"
run = "bun --eval \"const { page, render } = await import('./bsd/page.ts'); await Bun.write(page, render(await Bun.file(page).text()));\""
